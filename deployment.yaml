apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-test-app
spec:
  replicas: 2  # Number of pods
  selector:
    matchLabels:
      app: kubernetes-test-app
  template:
    metadata:
      labels:
        app: kubernetes-test-app
    spec:
      containers:
      - name: kubernetes-test-app
        image: kubernet-test-app:latest #get the image from the local minikube
        imagePullPolicy: Never  # Tell Kubernetes not to pull from a registry docker
        # image: vikash95/kubernetes-test-app:latest if toggle it then toggle above 2
        resources:
          limits:
            memory: "64Mi"
            cpu: "200m" #1/5 of one core
        ports:
        - containerPort: 5000
---
#service.yaml file provide the one common end point 
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-test-app
spec:
  selector:
    app: kubernetes-test-app
  ports:
  - port: 8080
    targetPort: 5000